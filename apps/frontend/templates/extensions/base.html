<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}VSHP Panel{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
{% block styles %}{% endblock %}

</head>
<body>
     <header class="navbar bg-body-tertiary border-bottom sticky-top py-0" style="height:56px;">
        <div class="container-fluid gap-2 flex-nowrap">
            <button class="btn btn-outline-secondary d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button>
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold me-lg-4" href="index.html">
                <span class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3" style="width:32px;height:32px;"><i class="bi bi-kanban"></i></span>
                <span class="d-none d-sm-inline">VSHP Panel</span>
            </a>
            <span class="text-body-secondary small text-truncate me-auto d-none d-md-block"></span>
            
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
        <aside id="sidebarWrap" class="col-lg-3 col-xl-2 p-0 border-end bg-body-tertiary sticky-lg-top align-self-start">
            <div class="offcanvas-lg offcanvas-start bg-body-tertiary h-100 d-flex flex-column" tabindex="-1" id="sidebar">
                <div class="offcanvas-header border-bottom"><h5 class="offcanvas-title">Меню</h5>
                    <button class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"></button></div>
                <div class="offcanvas-body d-flex flex-column p-0 flex-grow-1">
                    <nav class="nav nav-pills flex-column p-2 gap-1">
                        <a class="nav-link text-start d-flex gap-2" href="/"><i class="bi-speedometer2"></i><span>Главная</span></a>
                        <a class="nav-link text-start d-flex gap-2" href="/tester"><i class="bi-ui-checks"></i><span>Тестер</span></a>
                        <a class="nav-link text-start d-flex gap-2" href="/library"><i class="bi-collection"></i><span>Библиотека</span></a>
                    </nav>
                    <div class="mt-auto p-2 border-top">
                        
                            <div class="mt-auto">
                                <a class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2"
                                id="configBtn" href="/conf">
                                    <i class="bi bi-gear"></i><span>Конфиг</span>
                                </a>
                            </div>
                    </div>
                </div>
            </div>
        </aside>
        <main class="col-lg-9 col-xl-10 p-3 p-md-4" id="main">
            <div id="page">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastBox" style="z-index:1090;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
{% block scripts %}{% endblock %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const wrapper = document.getElementById('configBtnWrapper');
    if (!wrapper) return;

    new bootstrap.Tooltip(wrapper, {
        // Свой шаблон: тёмные утилиты Bootstrap прямо на .tooltip-inner, без стрелки
        template: `
            <div class="tooltip" role="tooltip" style="--bs-tooltip-bg: transparent; --bs-tooltip-opacity: 1;">
                <div class="tooltip-arrow">
                    <div class="bg-dark border-end border-bottom border-secondary"
                        style="position:absolute; top:0; left:50%; width:.566rem; height:.566rem; transform:translate(-50%,-50%) rotate(45deg);"></div>
                </div>
                <div class="tooltip-inner bg-dark text-white border border-secondary rounded-3 shadow-lg p-0 text-start"
                    style="max-width: 320px;"></div>
            </div>
        `,
        title: `
            <div class="p-3">
                <div class="d-flex align-items-center mb-2 border-bottom border-secondary pb-2">
                    <i class="bi bi-tools text-warning fs-4 me-2"></i>
                    <span class="fw-bold fs-5 text-white">В разработке</span>
                </div>
                <p class="mb-0 lh-sm small text-light opacity-75">
                    Мы активно работаем над созданием удобного интерфейса настроек. Скоро здесь появится возможность гибкой конфигурации всей системы.
                </p>
            </div>
        `,
        html: true,
        sanitize: false, // иначе Bootstrap вырежет style из шаблона
        placement: 'top',
        fallbackPlacements: ['top'],
        trigger: 'hover',
        delay: { show: 200, hide: 100 },
        animation: true,
        container: 'body'
    });
});
</script>
</body></html>
